# 02-120 Programming for Scientists, Fall 2026
# SINGLE SOURCE OF TRUTH for the course calendar.
# Edit this file, then run: python3 build_schedule.py
#
# Item kinds:
#   day.kind      lecture | recitation | exam | no-class | deadline
#   prepare.kind  required  (must be done BEFORE this day)
#                 after     (do this AFTER this class, before the next thing)
#                 reference (optional companion / catch-up)

course:
  number: "02-120"
  title: "Programming for Scientists"
  term: "Fall 2026"
  lecture_time: "Tue/Thu 9:30-10:50, GHC 4307"
  recitation_time: "Fri, GHC 4211 (A: 12:00, B: 3:00)"
  canvas: "https://canvas.cmu.edu/courses/55141"
  ed: "https://edstem.org/us/courses/101123/discussion"
  homework: "https://p4l-website.vercel.app/courses/02-120-homework/"
  daily: "https://p4l-website.vercel.app/courses/02-120-daily-challenges/"
  repo: "https://github.com/phcompeau/ProgrammingforScientists2026Undergrad"
  works: >-
    You learn the basics of programming on your own time, from the readings and code-along
    videos at programmingforlovers.com. We use class to build the scientific applications
    together. Each day below lists what to finish beforehand, and class starts from the
    assumption that you finished it.
  note: >-
    Code alongs listed under Complete before class are done on your own, ahead of that class meeting.

project:
  pdf: "project/Project_Description_F26.pdf"
  intro: >-
    You will spend the second half of the semester building a piece of scientific software of your
    own with Claude Code. The proposal is due Wednesday, October 7, so that you get feedback before
    Fall Break. Every project date is also on the calendar below.
  resources:
    - label: "Watch me build one, slowly"
      url: "https://youtu.be/f2w1WjsB1qc?t=4650"
      text: >-
        These two Vibe Coding Studio videos rebuild the spatial games model from our September 22
        class, slowly and completely, starting from the Nowak and May paper. Watch the end of Session 3,
        from 1:17:30 (47 minutes), which sets up the project folder in Claude Code and gives Claude a
        memory, the paper, and skills, then writes and tests the first function. Then watch all of
      link2_label: "Session 4"
      link2_url: "https://youtu.be/Dl2vhxYcVT8"
      text2: >-
        (2 hours 16 minutes), which writes a spec, builds and tests the model, animates it, and deploys
        it to the web as a finished app. That is the same path your project will follow. I went slowly
        and steadily on purpose so that you can see every step; with Opus 5.5, Claude will build
        something much bigger than this with less prompting and more accuracy.
    - label: "Claude accounts"
      text: >-
        We are going to get a Claude account for every student who does not already have one. If you
        do not have one yet, hold off on buying one and stand by for details.
    - label: "How I set up Claude"
      url: "claude-setup.html"
      text: >-
        My high-level guide to the setup I use every day, and which parts of it matter for your project.

