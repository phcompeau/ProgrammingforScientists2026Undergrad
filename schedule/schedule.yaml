  repo: "https://github.com/phcompeau/ProgrammingforScientists2026Undergrad"
  works: >-
    You learn the basics of programming on your own time, from the readings and code-along
    videos at programmingforlovers.com. We use class to build the scientific applications
    together. Each day below lists what to finish beforehand, and class starts from the
    assumption that you finished it.
  note: >-
    Code alongs listed under Complete before class are done on your own, ahead of that class meeting.

